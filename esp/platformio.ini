[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
monitor_speed = 115200
framework = arduino
lib_deps =
     https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
     links2004/WebSockets @ ^2.7.3
     olikraus/U8g2 @ ^2.36.18
   
